<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Albion Pathfinder</title>
  <meta name="description" content="Free shortest-path finder between Albion Online zones with a safety filter. Бесплатный поиск кратчайшего пути между зонами Albion Online.">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <div>
        <h1>Albion Pathfinder</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
    </div>
    <div class="seg lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <form id="route-form" autocomplete="off">
        <label class="field">
          <span data-i18n="from"></span>
          <input id="from" list="zone-list" data-i18n-ph="fromPh" required>
        </label>

        <button type="button" id="swap" class="swap" data-i18n-title="swap">⇅</button>

        <label class="field">
          <span data-i18n="to"></span>
          <input id="to" list="zone-list" data-i18n-ph="toPh" required>
        </label>
        <datalist id="zone-list"></datalist>

        <fieldset class="box">
          <legend data-i18n="safetyTitle"></legend>
          <label><input type="radio" name="safety" value="blue" checked><i class="dot blue"></i><span data-i18n="safeBlue"></span></label>
          <label><input type="radio" name="safety" value="yellow"><i class="dot yellow"></i><span data-i18n="safeYellow"></span></label>
          <label><input type="radio" name="safety" value="red"><i class="dot red"></i><span data-i18n="safeRed"></span></label>
          <label><input type="radio" name="safety" value="black"><i class="dot black"></i><span data-i18n="safeBlack"></span></label>
        </fieldset>

        <fieldset class="box">
          <legend data-i18n="metricTitle"></legend>
          <label><input type="radio" name="metric" value="hops" checked><span data-i18n="metricHops"></span></label>
          <label><input type="radio" name="metric" value="distance"><span data-i18n="metricDist"></span></label>
        </fieldset>

        <label class="check">
          <input type="checkbox" id="portals" checked>
          <span data-i18n="portals"></span>
        </label>

        <button type="submit" class="go" data-i18n="find"></button>
      </form>

      <div id="result" class="result" aria-live="polite"></div>
    </section>

    <section class="map-wrap">
      <svg id="map" role="img" data-i18n-aria="mapAria"></svg>
      <div class="legend">
        <span><i class="dot blue"></i><span data-i18n="cBlue"></span></span>
        <span><i class="dot yellow"></i><span data-i18n="cYellow"></span></span>
        <span><i class="dot red"></i><span data-i18n="cRed"></span></span>
        <span><i class="dot black"></i><span data-i18n="cBlack"></span></span>
        <span class="hint" data-i18n="mapHint"></span>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p><span data-i18n="disclaimer"></span>
      <span data-i18n="dataFrom"></span> <a href="https://github.com/ao-data/ao-bin-dumps" target="_blank" rel="noopener">ao-bin-dumps</a>,
      <span data-i18n="version"></span> <span id="data-version">…</span>. <span data-i18n="notIncluded"></span></p>
  </footer>

  <script src="pathfinder.js?v=3"></script>
  <script src="i18n.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
